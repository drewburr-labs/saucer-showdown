<svg xmlns="http://www.w3.org/2000/svg" width="36" height="40" viewBox="0 0 36 40">
  <!-- Warrior armour, drawn over grey.svg on the same canvas. Gold plus a team crest. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset="0.5" stop-color="#ffcc33"/>
      <stop offset="1" stop-color="#b8790f"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff3ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1b6f9a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- helmet shell -->
  <path d="M6.8 12 C6 4 11 0.6 18.5 0.6 C26.5 0.6 31.4 4 30.6 12 L27.8 9.6 Q18.6 6.2 9.6 9.6 Z" fill="url(#gold)" stroke="#140f26" stroke-width="2" stroke-linejoin="round"/>
  <!-- crest -->
  <path d="M15.5 1.2 Q19 -2 22 1.2 L20.5 5.5 L17 5.5 Z" fill="#ff00ff" stroke="#140f26" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- visor -->
  <path d="M9.4 9.8 Q18.6 6.6 29.2 9.8 L28 15.6 Q18.6 18 10 15.6 Z" fill="url(#visor)" stroke="#140f26" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 10.6 Q16 9.4 19.5 9.6" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <!-- shoulder plates and chest -->
  <path d="M8.6 22.4 Q11 19.6 14.2 21.4 L13.2 25.4 Q10 25.6 8.6 22.4 Z" fill="url(#gold)" stroke="#140f26" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M27.4 22.4 Q25 19.6 21.8 21.4 L22.8 25.4 Q26 25.6 27.4 22.4 Z" fill="url(#gold)" stroke="#140f26" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M15 23 L21 23 L20 28 L18 29.2 L16 28 Z" fill="url(#gold)" stroke="#140f26" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
