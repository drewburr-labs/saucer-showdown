<svg xmlns="http://www.w3.org/2000/svg" width="36" height="40" viewBox="0 0 36 40">
  <!-- Grey worker, head and torso (legs and arms are drawn in code). Faces right.
       Pivot (18,24) is the hitbox centre; feet land at y=39. Magenta = team suit. -->
  <defs>
    <radialGradient id="skin" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e3e9f2"/>
      <stop offset="0.6" stop-color="#aab5c6"/>
      <stop offset="1" stop-color="#76819a"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff80ff"/>
      <stop offset="1" stop-color="#800080"/>
    </linearGradient>
  </defs>
  <!-- torso -->
  <path d="M11.5 22 Q18 19.5 24.5 22 L25.5 31 Q18 33.5 10.5 31 Z" fill="url(#suit)" stroke="#140f26" stroke-width="2" stroke-linejoin="round"/>
  <path d="M10.8 28.4 Q18 30.6 25.2 28.4" fill="none" stroke="#140f26" stroke-width="1.6"/>
  <circle cx="20" cy="25" r="1.7" fill="#fff6a8" stroke="#140f26" stroke-width="0.8"/>
  <!-- neck -->
  <rect x="15.8" y="18.5" width="4.6" height="4" fill="#8d98ad" stroke="#140f26" stroke-width="1.5"/>
  <!-- head -->
  <path d="M18.5 1.8 C29 1.8 31.5 9 30 13.5 C28.6 17.6 23.5 21.2 19.6 21.2 C15.6 21.2 9.4 17.2 7.4 13.2 C5.4 8.6 8.5 1.8 18.5 1.8 Z" fill="url(#skin)" stroke="#140f26" stroke-width="2" stroke-linejoin="round"/>
  <!-- eyes -->
  <path d="M10.6 10.2 Q15 9 17.4 14.2 Q12.8 16.2 10.6 10.2 Z" fill="#0b0814"/>
  <path d="M28.6 10.2 Q24.6 9 21.6 14.2 Q26.4 16.2 28.6 10.2 Z" fill="#0b0814"/>
  <ellipse cx="13.2" cy="11.4" rx="1.3" ry="0.9" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="24.4" cy="11.4" rx="1.3" ry="0.9" fill="#ffffff" opacity="0.9"/>
  <path d="M18.3 18.1 Q19.6 18.7 20.8 18.1" fill="none" stroke="#5a6378" stroke-width="1" stroke-linecap="round"/>
  <path d="M11.5 4.8 Q15 3.2 19 3.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
</svg>
