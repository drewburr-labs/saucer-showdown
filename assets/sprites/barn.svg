<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190">
  <!-- The barn. Top-left sits at world (500,470); the flat roof is the T2 deck. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
