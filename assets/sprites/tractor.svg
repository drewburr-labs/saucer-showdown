<svg xmlns="http://www.w3.org/2000/svg" width="88" height="60" viewBox="0 0 88 60">
  <!-- Tractor body without wheels. Faces right. Pivot (44,38) is the hitbox centre;
       rear axle at (27,43), front axle at (63,48), ground at y=58. -->
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a52"/><stop offset="0.55" stop-color="#d63a2a"/><stop offset="1" stop-color="#8e1e18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfefff" stop-opacity="0.85"/><stop offset="1" stop-color="#3b6d8f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- exhaust -->
  <rect x="55" y="8" width="4.5" height="20" rx="1.5" fill="#3b3846" stroke="#140f26" stroke-width="1.8"/>
  <rect x="54" y="6" width="6.5" height="4" rx="1.2" fill="#55526a" stroke="#140f26" stroke-width="1.6"/>
  <!-- cab frame -->
  <path d="M12 12 L40 12 L41 30 L13 30 Z" fill="url(#glass)" stroke="#140f26" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M10 10 L43 10 L43 13.5 L10 13.5 Z" fill="url(#paint)" stroke="#140f26" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 14 L19 14 L17 28 L14.5 28 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M13 13 L15 13 L15.5 30 L13 30 Z" fill="#8e1e18"/>
  <!-- hood and body -->
  <path d="M10 30 L76 30 Q80 30 80 34 L80 44 L10 46 Z" fill="url(#paint)" stroke="#140f26" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M40 24 L74 24 Q78 24 78 28 L78 31 L40 31 Z" fill="url(#paint)" stroke="#140f26" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M44 26.5 L72 26.5" stroke="#ffb3a6" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#7a1813"><rect x="60" y="33" width="2.4" height="8" rx="1"/><rect x="65" y="33" width="2.4" height="8" rx="1"/><rect x="70" y="33" width="2.4" height="8" rx="1"/></g>
  <!-- grille and headlamp -->
  <rect x="78" y="31" width="5" height="12" rx="1.5" fill="#3b3846" stroke="#140f26" stroke-width="1.8"/>
  <circle cx="80" cy="28" r="3" fill="#fff6c2" stroke="#140f26" stroke-width="1.6"/>
  <!-- fender over the big wheel -->
  <path d="M8 44 Q10 22 27 22 Q44 22 46 40 L41 40 Q39 28 27 28 Q15 28 13 44 Z" fill="#b02c20" stroke="#140f26" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- seat -->
  <path d="M20 22 L30 22 L30 25 L19 25 Z" fill="#3b3846" stroke="#140f26" stroke-width="1.5"/>
  <!-- hitch -->
  <rect x="3" y="38" width="8" height="4" rx="1" fill="#55526a" stroke="#140f26" stroke-width="1.5"/>
</svg>
