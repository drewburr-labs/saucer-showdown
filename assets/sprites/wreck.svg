<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="0 0 80 40">
  <!-- Downed saucer. Pivot (40,24) is the hitbox centre; its top is walkable at y=16. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa1b8"/><stop offset="1" stop-color="#3f4560"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff00ff"/><stop offset="1" stop-color="#800080"/>
    </linearGradient>
  </defs>
  <!-- cracked dome -->
  <path d="M30 17 Q31 6 41 5.5 Q49 6 50 13 L47 11 L44 15 L40 10.5 L37 16 Z" fill="#2c5170" stroke="#140f26" stroke-width="2" stroke-linejoin="round"/>
  <path d="M33 13 L36 8.5" stroke="#9fe6ff" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- crumpled hull -->
  <path d="M4 22 Q10 15 24 16 L34 15 L38 18 L44 15.5 L58 16 Q72 16 77 23 L72 25 L66 23.5 L60 27 L52 25 L44 29 L36 25.5 L26 28.5 L18 25 L10 27 Z" fill="url(#metal)" stroke="#140f26" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M5 23 Q20 28 34 27.5 L40 31 L48 27.5 Q64 28 76 23.5 L74 28 Q56 35 40 34 Q22 35 7 28 Z" fill="url(#band)" stroke="#140f26" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M12 19 Q22 17.4 30 18" stroke="#c9cfe0" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- scorch marks and rivets -->
  <path d="M50 17 Q56 19 54 22 Q49 22 50 17 Z" fill="#1f1a2a" opacity="0.8"/>
  <path d="M18 20 Q22 21 21 23.5 Q17 23 18 20 Z" fill="#1f1a2a" opacity="0.8"/>
  <g fill="#1b1530"><circle cx="20" cy="29" r="1.6"/><circle cx="40" cy="31.5" r="1.6"/><circle cx="60" cy="29" r="1.6"/></g>
  <path d="M64 18 L70 12 M66 19 L73 16" stroke="#140f26" stroke-width="1.8" stroke-linecap="round"/>
</svg>
